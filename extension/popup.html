<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>FreeFeed</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>FreeFeed</h1>
      <p>Choose what appears on Instagram and the FreeFeed home.</p>

      <fieldset>
        <legend>Allowed activities</legend>

        <label><input type="checkbox" data-setting="allowFeed"> Feed</label>
        <label><input type="checkbox" data-setting="allowMessages"> Messages</label>
        <label><input type="checkbox" data-setting="allowSearch"> Search</label>
        <label><input type="checkbox" data-setting="allowNotifications"> Notifications</label>
        <label><input type="checkbox" data-setting="allowCreate"> Create</label>
        <label><input type="checkbox" data-setting="allowStories"> Stories</label>
        <label><input type="checkbox" data-setting="allowReels"> Reels</label>
        <label><input type="checkbox" data-setting="allowProfessionalDashboard"> Professional dashboard</label>
      </fieldset>

      <p class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
